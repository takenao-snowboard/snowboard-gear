<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snowboard Gear | Home</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="home.html">Snowboard Gear</a>

      <nav class="nav">
        <a href="home.html">Home</a>
        <a href="index.html">Board</a>
        <a href="#" aria-disabled="true">Bind</a>
        <a href="#" aria-disabled="true">Boot</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>最高のギアを、迷わず見つけよう。</h1>
      <p>シーズンとカテゴリから探せます。レビューで比較して納得の一本へ。</p>
    </section>

    <!-- シーズン選択 -->
    <section class="home-panel">
      <div class="season-select">
        <label for="season-select">シーズン：</label>
        <select id="season-select">
          <option value="2025-2026" selected>2025-2026</option>
          <option value="2024-2025">2024-2025</option>
        </select>
      </div>
      <p class="help-text">※ シーズンを選んでからカテゴリへ進んでください</p>
    </section>

    <!-- カテゴリ導線 -->
    <section class="category-cards">
      <a class="category-card" href="index.html" data-category="board">
        <h2>Board</h2>
        <p>板を探す</p>
      </a>

      <a class="category-card disabled" href="#" aria-disabled="true">
        <h2>Bind</h2>
        <p>準備中</p>
      </a>

      <a class="category-card disabled" href="#" aria-disabled="true">
        <h2>Boot</h2>
        <p>準備中</p>
      </a>
    </section>

    <!-- 後から追加する枠（今は空でOK） -->
    <section class="home-panel">
      <h2 class="section-title">人気・最新（後で追加）</h2>
      <p class="help-text">ここに「評価が高いギア」「最新レビュー」などを追加できます。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© Snowboard Gear</small>
    </div>
  </footer>

  <!-- シーズン選択を保存して、一覧ページへ引き継ぐ（表示だけでも後々役に立つ） -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const select = document.getElementById("season-select");
      if (!select) return;

      // 既に保存があれば復元
      const saved = localStorage.getItem("currentSeason");
      if (saved) select.value = saved;

      // 変更を保存
      select.addEventListener("change", () => {
        localStorage.setItem("currentSeason", select.value);
      });

      // カテゴリカード押下時も保存（念のため）
      document.querySelectorAll(".category-card").forEach(card => {
        card.addEventListener("click", () => {
          localStorage.setItem("currentSeason", select.value);
        });
      });
    });
  </script>
</body>
</html>
