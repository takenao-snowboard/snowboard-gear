<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>商品詳細</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo">Snowboard Gear</div>
    <nav>
      <a href="home.html">Home</a>
      <a href="index.html">Board</a>
    </nav>
  </header>

  <main class="container" id="product-detail">
    <!-- 商品情報がJSで入る -->
    <p id="season-label" class="season-label"></p>
  </main>
  
  <section class="container" product="reviews">
  
    <h2>レビュー</h2>
  
    <!-- 並び替え -->
    <div class="sort-buttons">
      <button data-sort="new">新着順</button>
      <button data-sort="old">古い順</button>
      <button data-sort="high">評価が高い順</button>
      <button data-sort="low">評価が低い順</button>
    </div>

    <!-- 絞り込み -->
    <div class="filter-box">
      <select id="filter-age">
        <option value="">すべての年代</option>
        <option value="10代">10代</option>
        <option value="20代">20代</option>
        <option value="30代">30代</option>
        <option value="40代以上">40代</option>
        <option value="50代以上">50代以上</option>
      </select>

      <select id="filter-style">
        <option value="">すべてのスタイル</option>
        <option value="グラトリ">グラトリ</option>
        <option value="パーク">パーク</option>
        <option value="フリーラン">フリーラン</option>
        <option value="パウダー">パウダー</option>
      </select>
    </div>
  
    <!-- レビュー一覧 -->
    <div id="review-list"></div>
  
    <!-- レビュー投稿 -->
  <div class="review-form">  
    <h3>レビューを書く</h3>
  
    <input type="text" id="nickname" placeholder="ニックネーム">
    <!-- 年代 -->
    <select id="age">
      <option value="">年代を選択</option>
      <option value="10代">10代</option>
      <option value="20代">20代</option>
      <option value="30代">30代</option>
      <option value="40代以上">40代</option>
      <option value="50代以上">50代以上</option>
    </select>

  <!-- スタイル -->
  <select id="style">
    <option value="">スタイルを選択</option>
    <option value="グラトリ">グラトリ</option>
    <option value="パーク">パーク</option>
    <option value="フリーラン">フリーラン</option>
    <option value="パウダー">パウダー</option>
  </select>
  
    <!-- ★評価 -->
    <div class="star-rating" data-rating="0">
      <span data-value="1">★</span>
      <span data-value="2">★</span>
      <span data-value="3">★</span>
      <span data-value="4">★</span>
      <span data-value="5">★</span>
    </div>
  
    <!-- レビュー本文 -->
    <textarea maxlength="300" placeholder="レビューを入力（300文字以内）"></textarea>
    <div class="char-count">残り 300 文字</div>
  
    <button id="submit-review">投稿する</button>
  </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
